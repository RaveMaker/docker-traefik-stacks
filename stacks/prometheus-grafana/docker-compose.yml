services:

  prometheus:
    image: prom/prometheus
    restart: always
    volumes:
      - ./prometheus/:/etc/prometheus/
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${podName}-prometheus.rule=Host(`${hostRuleProm}`)"
      - "traefik.http.routers.${podName}-prometheus.entrypoints=https"
      - "traefik.http.routers.${podName}-prometheus.tls=true"
      - "traefik.http.services.${podName}-prometheus.loadbalancer.server.port=9090"
    networks:
      - proxy

  grafana:
    image: grafana/grafana
    depends_on:
      - prometheus
    restart: always
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/:/etc/grafana/provisioning/
    environment:
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${podName}-grafana.rule=Host(`${hostRuleGrafana}`)"
      - "traefik.http.routers.${podName}-grafana.entrypoints=https"
      - "traefik.http.routers.${podName}-grafana.tls=true"
      - "traefik.http.services.${podName}-grafana.loadbalancer.server.port=3000"
    networks:
      - proxy
    user: "104"

networks:
  proxy:
    external: true
    name: proxy
