services:
  web:
    image: ${podName}-web
    build: .
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${podName}.rule=Host(`${hostRule}`)"
      - "traefik.http.routers.${podName}.entrypoints=https"
      - "traefik.http.routers.${podName}.tls=true"
      - "traefik.http.services.${podName}.loadbalancer.server.port=80"
    networks:
      - proxy
      - backend
    volumes:
      - ./html:/var/www/html
      - ./conf/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./conf/apache-default:/etc/apache2/sites-available/000-default.conf:ro

  mariadb:
    image: mariadb
    restart: always
    labels:
      - "traefik.enable=false"
    networks:
      - backend
    environment:
      MYSQL_DATABASE: ${dbName}
      MYSQL_USER: ${dbUser}
      MYSQL_PASSWORD: ${dbPass}
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - ./database:/var/lib/mysql

  backup:
    image: zeenlym/mariadb-backup
    depends_on:
      - mariadb
    restart: always
    labels:
      - "traefik.enable=false"
    networks:
      - backend
    environment:
      - TIMEZONE=${timeZone}
      - SCHEDULE=0 0 3 * *
      - BACKUP_METHOD=mysqldump
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=${dbName}
      - MYSQL_USER=${dbUser}
      - MYSQL_PASSWORD=${dbPass}
    volumes:
      - ./backup:/backup

networks:
  proxy:
    external: true
    name: proxy
  backend:
